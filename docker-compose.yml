name: kitchenos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitchenos
      POSTGRES_PASSWORD: kitchenos
      POSTGRES_DB: kitchenos
    ports:
      # Host port 5434: 5432/5433 are already taken by other local services on this machine.
      - "5434:5432"
    volumes:
      - kitchenos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchenos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kitchenos_postgres_data:
